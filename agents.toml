# Agent CLIs `synth-panel detect` knows how to look for.
#
# NO CLI IS PREFERRED. detect lists everything it finds, picks the first
# alphabetically, and prints the line that switches to any other. The dispatcher
# does not know or care which one you use: it writes a prompt to stdin and reads
# an answer from stdout. Anything that does that works, listed here or not —
# put it in [dispatch].command in config.toml and skip this file entirely.
#
# Each entry has the same three fields, and every entry is held to the same bar.
#
#   command     the bare headless invocation: read a prompt on stdin, write the
#               answer to stdout.
#   tuning      flags that pin a CHEAP MODEL and BLOCK TOOLS. Empty means nobody
#               has supplied them for this CLI yet, and detect will say so.
#   entrypoint  the file this CLI reads on its own when it starts in a directory.
#               "AGENTS.md" means it already reads the protocol; detect leaves it alone.
#
# WHY TUNING IS A FIELD AND NOT AN AFTERTHOUGHT
#
#   cost      a five-persona panel is five separate calls, all billed to you.
#             Measured on one CLI, same prompt: $0.2591 on its default model,
#             $0.0417 on its small one. Personas do not need a frontier model.
#   isolation a persona has nothing to look up. A persona that cannot read a
#             file cannot read yours.
#
# An empty `tuning` is a gap in this repo, not a property of that CLI. If you
# know your CLI's flags for "small model" and "no tools", a PR filling them in
# is the single most useful contribution here.

[amp]
command = ["amp", "-x"]
tuning = []
entrypoint = "AGENTS.md"

[claude]
command = ["claude", "-p"]
tuning = ["--model", "haiku", "--strict-mcp-config", "--disallowed-tools", "*"]
entrypoint = "CLAUDE.md"

[codex]
command = ["codex", "exec", "-"]
tuning = []
entrypoint = "AGENTS.md"

[crush]
command = ["crush", "run", "-q"]
tuning = []
entrypoint = "CRUSH.md"

[cursor-agent]
command = ["cursor-agent", "-p"]
tuning = []
entrypoint = "AGENTS.md"

[gemini]
command = ["gemini", "-p"]
tuning = []
entrypoint = "GEMINI.md"

[opencode]
command = ["opencode", "run"]
tuning = []
entrypoint = "AGENTS.md"
