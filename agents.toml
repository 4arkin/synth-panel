# Agent CLIs `synth-panel detect` knows how to look for.
#
# No CLI is preferred. detect lists everything it finds, picks the first
# alphabetically, and prints the line that switches to any other. Anything that
# takes a prompt and prints an answer works, listed here or not — put it in
# [dispatch] in config.toml.
#
# Every entry carries the same five fields.
#
#   command      the headless invocation
#   prompt_via   "stdin" or "arg" — how that CLI wants to be handed a prompt
#   tuning       flags that select a small model and block tools. Empty = the
#                CLI runs on its default model, and detect prints "default"
#   entrypoint   the file this CLI reads on its own in a directory. "AGENTS.md"
#                means it already reads the protocol and detect leaves it alone
#   notes        where the above came from, and what to set yourself
#
# WHY TUNING MATTERS. A five-persona panel is five separate calls to your agent
# CLI. What that costs depends on how that CLI is authenticated:
#
#   on a subscription   the calls consume your normal usage and count against
#                       your rate limits. No separate bill arrives. Five personas
#                       is five times the usage of one, so a cheap model buys you
#                       headroom rather than money.
#   on API credits      the calls cost actual money at that model's rate.
#
# Measured with claude, same prompt, as the equivalent-dollar figure the CLI
# itself reports: $0.2591 on its default model, $0.0417 on its small one. On a
# subscription that is a usage ratio, not an invoice.
#
# Personas do not need a frontier model and have nothing to look up, and a
# persona that cannot read a file cannot read yours.
#
# Nothing here requires an API key. The embedding provider in config.toml is
# the only separate account, and only optional scoring uses it.
#
# [claude] is exercised end to end, cost measurements included. The other
# entries are written from each vendor's documentation. `synth-panel doctor`
# confirms any entry in one command. If yours needs a change, send a PR.

[amp]
command = ["amp", "-x"]
prompt_via = "stdin"
tuning = ["--fast"]
entrypoint = "AGENTS.md"
notes = "Docs: -x/--execute, prompt as arg or piped stdin, both work. --fast is the cheap mode. No tool-disable flag documented."

[claude]
command = ["claude", "-p"]
prompt_via = "stdin"
tuning = ["--model", "haiku", "--strict-mcp-config", "--disallowed-tools", "*"]
entrypoint = "CLAUDE.md"
notes = "Exercised end to end, including the cost measurements above."

[codex]
command = ["codex", "exec", "-"]
prompt_via = "stdin"
tuning = ["--sandbox", "read-only"]
entrypoint = "AGENTS.md"
notes = "Docs: `codex exec -` reads the whole prompt from stdin; read-only sandbox is the documented default for automation. Pin a small model with -m/--model; the name depends on your account. --ignore-user-config is also worth adding if you have global instructions you do not want personas inheriting."

[crush]
command = ["crush", "run"]
prompt_via = "arg"
tuning = []
entrypoint = "CRUSH.md"
notes = "From `crush run`, with the prompt as an argument. Model selection is in crush's own config, with no flag. Confirm with `synth-panel doctor`, and check `crush run --help` if it fails."

[cursor-agent]
command = ["cursor-agent", "-p"]
prompt_via = "arg"
tuning = []
entrypoint = "AGENTS.md"
notes = "Docs: -p/--print is non-interactive and the prompt is an argument; stdin is not documented. --model exists but the docs list no model names, so use --list-models and pin a small one yourself. No tool-disable flag exists."

[gemini]
command = ["gemini"]
prompt_via = "stdin"
tuning = ["--model", "gemini-2.5-flash"]
entrypoint = "GEMINI.md"
notes = "Docs: headless mode triggers on a non-TTY, which a subprocess is, and stdin is read as the prompt — so no -p is needed for our shape. gemini-2.5-flash is the small model. No tool/MCP-disable flag documented."

[opencode]
command = ["opencode", "run"]
prompt_via = "arg"
tuning = []
entrypoint = "AGENTS.md"
notes = "Docs: `run` takes the message as arguments, NOT stdin. Model is --model provider/model, which is account-specific, so no default is filled in. Tools can be restricted per-agent via --permissions."
