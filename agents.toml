# Registry of agent CLIs `synth-panel detect` knows how to look for.
#
# `verified` means the invocation below has been run end-to-end by this project.
# `unverified` means the CLI is recognised but its headless flags have not been
# exercised here — detect will still configure it, and `synth-panel doctor` will
# tell you in one command whether it actually works. Send a PR flipping the flag
# if you verify one.
#
# entrypoint = the file that CLI reads on its own when it starts in a directory.
#
# EVERY DISPATCH IS BILLED TO YOU, on whatever account that CLI is logged into.
# A panel of five personas is five separate calls. Pin a cheap model in the command
# — the entries below do where the flags are known.

[claude]
# Personas do not need a frontier model, and they do not need tools. Pinning both
# is a cost decision with measured numbers behind it — one persona, same prompt:
#   claude -p                                    $0.2591  (default model)
#   claude -p --model haiku                      $0.0538
#   + --strict-mcp-config --disallowed-tools '*' $0.0369
# Blocking tools is also an isolation win: a persona that cannot read a file cannot
# accidentally read yours.
command = ["claude", "-p", "--model", "haiku", "--strict-mcp-config", "--disallowed-tools", "*"]
entrypoint = "CLAUDE.md"
verified = true

[codex]
command = ["codex", "exec", "-"]
entrypoint = "AGENTS.md"
verified = false

[cursor-agent]
command = ["cursor-agent", "-p"]
entrypoint = "AGENTS.md"
verified = false

[gemini]
command = ["gemini", "-p"]
entrypoint = "GEMINI.md"
verified = false

[opencode]
command = ["opencode", "run"]
entrypoint = "AGENTS.md"
verified = false

[amp]
command = ["amp", "-x"]
entrypoint = "AGENTS.md"
verified = false

[crush]
command = ["crush", "run", "-q"]
entrypoint = "CRUSH.md"
verified = false
