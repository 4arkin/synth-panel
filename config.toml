# synth-panel configuration.
# Copy to config.local.toml to override without touching version control.

[dispatch]
# The agent CLI used to run each persona in its own process.
# One persona, one process, no shared context.
# Fill this with `synth-panel detect`, or edit it by hand.
command = []
# How your CLI wants the prompt: "stdin" (piped) or "arg" (last argument).
# `detect` fills this in from agents.toml.
prompt_via = "stdin"
timeout_seconds = 420
max_parallel = 5

[embedding]
# OPTIONAL. Only scoring uses it (docs/reference-statements.md). Leave it empty
# and panels run in full: verdict counts, objections, the disagreement map and
# the stopped-reading line. The run states which mode it used.
#
# Any OpenAI-compatible /embeddings endpoint works. Nothing is hard-coded to a
# vendor, and there is no default. Examples, in no order of preference:
#   a local runner  -> http://localhost:11434/v1/embeddings   (nomic-embed-text)
#   a hosted one    -> whatever your provider's /embeddings URL is
# api_key_env is the NAME of an environment variable holding a key, if your
# endpoint needs one. A local endpoint needs none, so leave it empty.
endpoint = ""
model = ""
api_key_env = ""

[panel]
# Panel composition. These settings keep the panel able to disagree.
size_min = 3
size_max = 5
require_skeptic = true
min_distinct_roles = 2
rotation_depth = 2
